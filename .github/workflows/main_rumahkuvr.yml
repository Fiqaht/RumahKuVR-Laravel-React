# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Laravel + React app to Azure Web App - rumahkuvr

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # ============================================================
  # BUILD JOB
  # Laravel + React/Vite
  # ============================================================
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # PHP / Laravel
      # ----------------------------------------------------------
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, bcmath, fileinfo, openssl, pdo, pdo_mysql, tokenizer
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-progress \
            --no-interaction \
            --no-dev \
            --optimize-autoloader

      # ----------------------------------------------------------
      # Laravel runtime directories
      # ----------------------------------------------------------
      - name: Prepare Laravel runtime directories
        run: |
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

      # ----------------------------------------------------------
      # Node.js / React / Vite
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

      # ----------------------------------------------------------
      # Verify production build
      # ----------------------------------------------------------
      - name: Verify production build
        run: |
          echo "Checking Laravel files..."

          test -f artisan
          test -f composer.json
          test -f public/index.php

          echo "Checking Vite production build..."

          test -d public/build
          test -f public/build/manifest.json

          echo "Laravel + React production build verified successfully."

      # ----------------------------------------------------------
      # Upload artifact
      # ----------------------------------------------------------
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumahkuvr-app
          path: |
            .
            !node_modules/
            !.git/
            !.github/
            !tests/
          retention-days: 1

  # ============================================================
  # DEPLOY JOB
  # Azure App Service
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      # ----------------------------------------------------------
      # Download build artifact
      # ----------------------------------------------------------
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: rumahkuvr-app
          path: .

      # ----------------------------------------------------------
      # Azure OIDC Login
      # These secret names were created by Azure Deployment Center
      # ----------------------------------------------------------
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D74EC0367F3C4F9EA55D12CA8A731822 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2B7F874164234ACFBE78FCEC668510AF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_55AED18B7EFC4CDB9817334FF6BEE427 }}

      # ----------------------------------------------------------
      # Deploy Laravel + built React assets
      # ----------------------------------------------------------
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'rumahkuvr'
          slot-name: 'Production'
          package: .

      # ----------------------------------------------------------
      # Logout
      # ----------------------------------------------------------
      - name: Azure logout
        run: az logout
          
